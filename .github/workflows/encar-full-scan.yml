name: ENCAR Full Map Scan v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous scan checkpoint
        uses: actions/cache/restore@v4
        with:
          path: scan_output
          key: encar-full-map-v4-${{ github.run_id }}
          restore-keys: |
            encar-full-map-v4-

      - name: Run scanner
        run: |
          python encar_full_scan_v4.py \
            --out scan_output \
            --resume \
            --delay 0.45 \
            --max-requests 60000 \
            --max-runtime-minutes 330 \
            --probe-preview-count 5

      - name: Save checkpoint for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan_output
          key: encar-full-map-v4-${{ github.run_id }}

      - name: Upload full scan ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENCAR_FULL_MAP_V4
          path: |
            scan_output/ENCAR_FULL_MAP.zip
            scan_output/manifest.json
            scan_output/checkpoint.json
            scan_output/errors.jsonl
            scan_output/first_ads.jsonl
          if-no-files-found: warn
          retention-days: 30
